<h1>Stats</h1>
<div>
    <form [formGroup]="form" (ngSubmit)="fetchStats()">
        <label for="from">From:</label>
        <input type="date" formControlName="from" name="from" id="from">
        <br>
        <label for="to">To:</label>
        <input type="date" formControlName="to" name="to" id="to">
        <br>
        <button type="submit">Get stats</button>
    </form>
    <div>
      <canvas
    baseChart
    [data]="pieChartData()"
    [type]="pieChartType"
    [options]="pieChartOptions"
    >
    </canvas>

        

    </div>
</div>
